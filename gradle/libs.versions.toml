navigation = "2.10.2"
room = "2.8.5"
work = "2.12.0"
datastore = "1.3.0"
camera = "1.6.2"
mlkitBarcode = "17.3.0"
retrofit = "3.0.0"
okhttp = "5.5.1"
serialization = "1.12.0"
coroutines = "1.11.0"
